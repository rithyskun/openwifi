<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenWiFi Mesh</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <h1>OpenWiFi</h1>
        <div id="self-info"></div>
      </div>
      <div id="sidebar-tabs">
        <button class="sidebar-tab active" data-tab="peers">Peers</button>
        <button class="sidebar-tab" data-tab="ai">AI</button>
      </div>
      <div id="peer-section" class="sidebar-panel active">
        <h2>Available</h2>
        <ul id="discovered-list"></ul>
        <h2>Connected (<span id="peer-count">0</span>)</h2>
        <ul id="peer-list"></ul>
      </div>
      <div id="ai-section" class="sidebar-panel">
        <div id="ai-messages"></div>
        <div id="ai-input-area">
          <div id="ai-input-row">
            <select id="ai-target-select">
              <option value="__local__">Local</option>
            </select>
            <textarea id="ai-input" placeholder="Ask Qwen..." rows="2"></textarea>
            <button id="ai-send-btn">Ask</button>
          </div>
        </div>
      </div>
    </aside>
    <main id="main">
      <div id="messages"></div>
      <div id="input-area">
        <select id="target-select">
          <option value="*broadcast*">Broadcast (All)</option>
        </select>
        <input type="text" id="message-input" placeholder="Type a message..." autofocus>
        <button id="send-btn">Send</button>
        <label id="file-btn" class="btn">File
          <input type="file" id="file-input" hidden>
        </label>
      </div>
      </div>
    </main>
  </div>

  <div id="pin-modal" class="modal hidden">
    <div class="modal-content">
      <div id="pin-modal-body"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
